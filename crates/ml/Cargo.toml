[package]
name = "photocraft-ml"
description = "Local AI models for PhotoCraft: the model registry, tensor pre/post-processing and (feature `runtime`) pure-Rust ONNX inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# ONNX inference (tract: pure Rust, CPU) and SHA-256 checks of downloaded models. Off in the
# browser's main wasm, which has no room for a runtime under its size gate and must not block the
# UI thread: there inference runs in the worker wasm (apps/photocraft-ml-worker), which turns this
# on, as do the desktop app and the CLI. See docs/decisions.md.
runtime = ["dep:tract-onnx", "dep:sha2", "dep:getrandom"]

[dependencies]
thiserror = { workspace = true }
# MIT OR Apache-2.0. Loads ONNX files at run time, so no model is ever built in.
tract-onnx = { version = "0.23.8", optional = true }
# MIT OR Apache-2.0.
sha2 = { version = "0.10", optional = true }

# tract's random-number dependency needs its browser entropy source named explicitly on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
